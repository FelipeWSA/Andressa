<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andressa e Felipe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pinyon+Script&display=swap');

    :root {
      --primary-color: #ff4d4d;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --bg-dark: #0a0a0a;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
      min-height: 100vh;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 40px 20px;
      border-radius: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      animation: fadeInUp 1.5s ease-out;
      position: relative;
      z-index: 1;
    }

    .title {
      /* NOVA FONTE CURSIVA APLICADA AQUI */
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(48px, 15vw, 64px); /* Tamanho aumentado para fonte cursiva */
      font-weight: 400; /* Mais fina */
      margin-bottom: 20px; /* Ajuste do espaçamento */
      color: var(--primary-color);
      text-transform: none; /* Mantém a caixa das letras */
      letter-spacing: 2px; /* Reduzido para ligar as letras */
      text-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
    }

    .slider-container {
      position: relative;
      width: 100%;
      border-radius: 15px;
      margin-bottom: 30px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .slider-images {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .slider-images img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .counter {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(5px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 20px 10px;
      transition: all 0.3s ease;
    }

    .counter-box:hover {
      background: rgba(255, 77, 77, 0.1);
      transform: translateY(-5px);
      border-color: var(--primary-color);
    }

    .counter-box span {
      display: block;
      font-size: 32px;
      font-weight: bold;
      color: var(--primary-color);
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
    }

    .counter-box label {
      font-size: 11px;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: 1.5px;
    }

    .message {
      padding: 30px;
      font-size: 1.15rem;
      color: #fff;
      line-height: 1.8;
      font-style: italic;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      margin-top: 25px;
      border: 1px solid var(--glass-border);
    }

    /* Partículas de Coração */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: floatUp 1.5s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) scale(2) rotate(25deg); opacity: 0; }
    }

    /* Chuva de Corações Caindo */
    .falling-heart {
      position: fixed;
      top: -10%;
      user-select: none;
      pointer-events: none;
      z-index: 0;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">Andressa & Felipe</div>

    <div class="slider-container" id="sliderContainer">
      <div class="slider-images" id="sliderImages">
        <img src="image1.jpg" alt="Foto 1">
        <img src="image2.jpg" alt="Foto 2">
        <img src="image3.jpg" alt="Foto 3">
        <img src="image4.jpg" alt="Foto 4">
        <img src="image5.jpg" alt="Foto 5">
        <img src="image6.jpg" alt="Foto 6">
        <img src="image7.jpg" alt="Foto 7">
      </div>
    </div>

    <div class="counter">
      <div class="counter-box"> <span id="years">0</span> <label>Anos</label> </div>
      <div class="counter-box"> <span id="months">0</span> <label>Meses</label> </div>
      <div class="counter-box"> <span id="days">0</span> <label>Dias</label> </div>
      <div class="counter-box"> <span id="hours">0</span> <label>Horas</label> </div>
      <div class="counter-box"> <span id="minutes">0</span> <label>Minutos</label> </div>
      <div class="counter-box"> <span id="seconds">0</span> <label>Segundos</label> </div>
    </div>

    <div class="message">
      "Eu amo o seu sorriso. Amo a forma como você enxerga o mundo. <br>
      Amo as suas manias. Te amo assim, por completo."
    </div>
  </div>

  <script>
    const audio = new Audio('https://github.com/FelipeWSA/Meu-Amor/raw/refs/heads/main/music.mp3');
    audio.loop = true;

    document.addEventListener('click', (e) => {
      if (audio.paused) audio.play();
      createHeart(e.clientX, e.clientY);
    });

    function createHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerHTML = ['❤️', '💖', '💝', '💕'][Math.floor(Math.random() * 4)];
      heart.style.left = (x - 15) + 'px';
      heart.style.top = (y - 15) + 'px';
      heart.style.fontSize = '24px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1500);
    }

    // --- NOVA FUNÇÃO PARA CHUVA DE CORAÇÕES ---
    function createFallingHeart() {
      const heart = document.createElement('div');
      heart.className = 'falling-heart';
      heart.innerHTML = ['❤️', '💖'][Math.floor(Math.random() * 2)]; // Apenas corações vermelhos/rosa
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = Math.random() * 15 + 10 + 'px';
      heart.style.opacity = Math.random() * 0.5 + 0.2;
      const duration = Math.random() * 5 + 7;
      heart.style.animationDuration = duration + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }
    // Cria um coração a cada 600ms
    setInterval(createFallingHeart, 600);

    const sliderImages = document.getElementById("sliderImages");
    const totalImages = document.querySelectorAll("#sliderImages img").length;
    let currentIndex = 0;

    function nextImage() {
      currentIndex = (currentIndex + 1) % totalImages;
      sliderImages.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
    setInterval(nextImage, 5000);

    const startDate = new Date("2025-03-27T00:00:00");

    function updateTimer() {
      const now = new Date();
      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();
      let days = now.getDate() - startDate.getDate();

      if (days < 0) {
        months--;
        days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("years").innerText = years;
      document.getElementById("months").innerText = months;
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = now.getHours();
      document.getElementById("minutes").innerText = now.getMinutes();
      document.getElementById("seconds").innerText = now.getSeconds();
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
