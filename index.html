<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andressa e Felipe</title>
  <style>
    :root {
      --primary-color: #ff4d4d;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-soft: #ccc;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-dark);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      background-color: var(--card-bg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .title {
      font-size: clamp(24px, 8vw, 36px);
      margin-bottom: 20px;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* Slider Melhorado */
    .slider-container {
      position: relative;
      width: 100%;
      max-height: 500px;
      margin: 20px 0;
      overflow: hidden;
      border-radius: 12px;
      touch-action: pan-y; /* Melhora o scroll vertical no mobile */
    }

    .slider-images {
      display: flex;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .slider-images img {
      width: 100%;
      height: 400px; /* Altura fixa para manter o padrão */
      object-fit: cover; /* Evita que as fotos fiquem esticadas */
      flex-shrink: 0;
    }

    /* Contador Estilizado */
    .counter {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 15px;
      margin: 30px 0;
    }

    .counter-box {
      background-color: #262626;
      border: 1px solid #333;
      border-bottom: 3px solid var(--primary-color);
      border-radius: 10px;
      padding: 15px 10px;
      transition: transform 0.3s ease;
    }

    .counter-box:hover {
      transform: translateY(-5px);
    }

    .counter-box span {
      display: block;
      font-size: 28px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .counter-box label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-soft);
      letter-spacing: 1px;
    }

    .message {
      background: linear-gradient(145deg, #252525, #1a1a1a);
      border-left: 5px solid var(--primary-color);
      border-radius: 8px;
      padding: 25px;
      font-size: 1.1rem;
      color: #ffe0e0;
      font-style: italic;
      line-height: 1.8;
      margin-top: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    /* Feedback visual do áudio */
    .audio-hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">Andressa & Felipe</div>
    <p class="audio-hint">(Clique em qualquer lugar para música 🎵)</p>

    <div class="slider-container" id="sliderContainer">
      <div class="slider-images" id="sliderImages">
        <img src="image1.jpg" alt="Momento 1">
        <img src="image2.jpg" alt="Momento 2">
        <img src="image3.jpg" alt="Momento 3">
        <img src="image4.jpg" alt="Momento 4">
        <img src="image5.jpg" alt="Momento 5">
        <img src="image6.jpg" alt="Momento 6">
        <img src="image7.jpg" alt="Momento 7">
      </div>
    </div>

    <div class="counter">
      <div class="counter-box">
        <span id="years">0</span>
        <label>Anos</label>
      </div>
      <div class="counter-box">
        <span id="months">0</span>
        <label>Meses</label>
      </div>
      <div class="counter-box">
        <span id="days">0</span>
        <label>Dias</label>
      </div>
      <div class="counter-box">
        <span id="hours">0</span>
        <label>Horas</label>
      </div>
      <div class="counter-box">
        <span id="minutes">0</span>
        <label>Minutos</label>
      </div>
      <div class="counter-box">
        <span id="seconds">0</span>
        <label>Segundos</label>
      </div>
    </div>

    <div class="message">
      "Eu amo o seu sorriso. Amo a forma como você enxerga o mundo. <br>
      Amo as suas manias. Te amo assim, por completo."
    </div>
  </div>

  <script>
    // Configurações de Áudio
    const audio = new Audio('https://github.com/FelipeWSA/Meu-Amor/raw/refs/heads/main/music.mp3');
    audio.loop = true;

    document.body.addEventListener('click', () => {
      audio.paused ? audio.play() : audio.pause();
    }, { once: false });

    // Slider de Imagens
    const sliderImages = document.getElementById("sliderImages");
    const images = document.querySelectorAll("#sliderImages img");
    let currentIndex = 0;
    let startX = 0;
    let isDragging = false;
    let autoSlideInterval;

    function updateSlider(smooth = true) {
      sliderImages.style.transition = smooth ? "transform 0.5s ease-in-out" : "none";
      sliderImages.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    }

    // Touch Events (Mobile Drag)
    sliderImages.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      isDragging = true;
      clearInterval(autoSlideInterval);
    });

    sliderImages.addEventListener("touchmove", e => {
      if (!isDragging) return;
      const currentX = e.touches[0].clientX;
      const diff = startX - currentX;
      // Impede o arraste visual livre para manter a performance, 
      // foca apenas no gesto de "swipe"
    });

    sliderImages.addEventListener("touchend", e => {
      isDragging = false;
      const endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) nextImage();
      else if (startX - endX < -50) prevImage();
      startAutoSlide();
    });

    function startAutoSlide() {
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(nextImage, 5000);
    }
    startAutoSlide();

    // Lógica do Contador (Melhorada)
    const startDate = new Date("2025-03-27T00:00:00");

    function updateTimer() {
      const now = new Date();
      
      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();
      let days = now.getDate() - startDate.getDate();

      // Ajuste se o dia atual for menor que o dia de início
      if (days < 0) {
        months--;
        const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += lastMonth.getDate();
      }

      // Ajuste se o mês atual for menor que o mês de início
      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("years").innerText = years;
      document.getElementById("months").innerText = months;
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = now.getHours();
      document.getElementById("minutes").innerText = now.getMinutes();
      document.getElementById("seconds").innerText = now.getSeconds();
    }

    setInterval(updateTimer, 1000);
    updateTimer(); // Execução imediata
  </script>
</body>
</html>
